<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1b1634"><title>Chromafold · Shader workbench</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/globals.css"><link rel="stylesheet" href="/workspace.css"></head>
<body><header class="mast"><a class="brand" href="/" aria-label="Chromafold home"><img src="/logo.png" alt="">Chromafold</a><a class="install" href="/install">Get Android <span aria-hidden="true">↗</span></a></header>
<main><h1>Fragment studio</h1><div class="bench"><section class="stage"><canvas id="preview" aria-label="Compiled fragment shader preview"></canvas><div class="bar"><span id="status" role="status"></span><button id="pause" class="ghost">Pause</button></div></section>

</main><footer><span>Chromafold</span><div><a href="https://github.com/hamzabounibanedz/shader-editor-android">Source</a><a href="https://github.com/hamzabounibanedz/shader-editor-android/releases/latest">Android releases</a><a href="/FONT-LICENSE.txt">Font license</a></div></footer><p id="message" role="status" aria-live="polite"></p><script type="module" src="/workspace.js"></script></body></html>
